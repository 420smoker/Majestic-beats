[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "majestic-beats"
version = "0.1.0"
description = "Programmatic drum loop generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydub>=0.25"]

[project.scripts]
majestic-beats = "majestic_beats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
